name: Deploy ProCash
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: procash_test
          POSTGRES_USER: procash_test
          POSTGRES_PASSWORD: procash_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procash_test -d procash_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'procash_test' }}
      DB_USERNAME: procash_test
      DB_PASSWORD: procash_test_password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, gd, mbstring, pdo_pgsql, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - run: vendor/bin/pint --test
      - run: php artisan test
      - name: Test deployment and rollback
        if: matrix.database == 'sqlite'
        run: python3 tests/deploy_workflow_test.py
      - run: php artisan view:cache
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/procash' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${SSH_PRIVATE_KEY:?Missing VPS_SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS secret}"
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment scripts
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid VPS_PORT'; exit 1; }
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          remote_dir=$(ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mktemp -d /tmp/procash-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/procash-deploy\.[A-Za-z0-9]+$ ]] || { echo 'Invalid temporary deployment directory'; exit 1; }
          echo "directory=$remote_dir" >> "$GITHUB_OUTPUT"
          scp "${ssh_options[@]}" -P "$VPS_PORT" deploy/deploy.sh deploy/prepare-env.php "$VPS_USER@$VPS_HOST:$remote_dir/"
      - name: Deploy tested Laravel image
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
          REMOTE_DIR: ${{ steps.upload.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST"
          printf -v remote_command 'bash %q %q %q %q %q' "$REMOTE_DIR/deploy.sh" "$DEPLOY_PATH" "$image_ref" "$DEPLOY_REVISION" "$REGISTRY_USER"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -T -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command"
      - name: Remove temporary scripts
        if: always() && steps.upload.outputs.directory != ''
        env:
          REMOTE_DIR: ${{ steps.upload.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REMOTE_DIR" =~ ^/tmp/procash-deploy\.[A-Za-z0-9]+$ ]]
          printf -v cleanup 'rm -f -- %q %q; rmdir -- %q' "$REMOTE_DIR/deploy.sh" "$REMOTE_DIR/prepare-env.php" "$REMOTE_DIR"
          ssh -T -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "$cleanup"
