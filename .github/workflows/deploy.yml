name: Deploy ProCash
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: procash_test
          POSTGRES_USER: procash_test
          POSTGRES_PASSWORD: procash_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procash_test -d procash_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://procash_test:procash_test_password@127.0.0.1:5432/procash_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: go mod verify
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal web/embed.go)"
      - run: go vet ./...
      - name: Check Go vulnerability advisories
        run: |
          if ! go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... > /tmp/govulncheck.log 2>&1; then
            cat /tmp/govulncheck.log
            python3 -c 'from pathlib import Path; message = Path("/tmp/govulncheck.log").read_text()[-6000:]; print("::error title=Go vulnerability check::" + message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          cat /tmp/govulncheck.log
      - name: Install Chromium for XSS regression tests
        run: npx playwright-core install --with-deps chromium
      - run: go test -race -count=1 ./...
      - run: go build -o /tmp/procash ./cmd/procash
      - name: Test deployment and rollback
        env:
          PROCASH_TEST_BINARY: /tmp/procash
        run: python3 tests/deploy_workflow_test.py
      - name: Test administrator access workflow
        run: python3 tests/admin_access_test.py
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/procash' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${SSH_PRIVATE_KEY:?Missing VPS_SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS secret}"
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment scripts
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid VPS_PORT'; exit 1; }
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          remote_dir=$(ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mktemp -d /tmp/procash-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/procash-deploy\.[A-Za-z0-9]+$ ]] || { echo 'Invalid temporary deployment directory'; exit 1; }
          echo "directory=$remote_dir" >> "$GITHUB_OUTPUT"
          scp "${ssh_options[@]}" -P "$VPS_PORT" deploy/deploy.sh "$VPS_USER@$VPS_HOST:$remote_dir/"
      - name: Deploy tested Go image
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
          REMOTE_DIR: ${{ steps.upload.outputs.directory }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.MAIL_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || secrets.MAIL_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.MAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.MAIL_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.MAIL_FROM_ADDRESS }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
        shell: bash
        run: |
          set -euo pipefail
          mail_settings=$(python3 -c 'import json,os; print(json.dumps({key:os.environ.get(key, "") for key in ("SMTP_HOST","SMTP_PORT","SMTP_USERNAME","SMTP_PASSWORD","SMTP_FROM","SMTP_SECURITY")}))')
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST"
          printf -v remote_command 'bash %q %q %q %q %q' "$REMOTE_DIR/deploy.sh" "$DEPLOY_PATH" "$image_ref" "$DEPLOY_REVISION" "$REGISTRY_USER"
          printf '%s\n%s\n' "$REGISTRY_TOKEN" "$mail_settings" | ssh -T -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command"
      - name: Remove temporary scripts
        if: always() && steps.upload.outputs.directory != ''
        env:
          REMOTE_DIR: ${{ steps.upload.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REMOTE_DIR" =~ ^/tmp/procash-deploy\.[A-Za-z0-9]+$ ]]
          printf -v cleanup 'rm -f -- %q; rmdir -- %q' "$REMOTE_DIR/deploy.sh" "$REMOTE_DIR"
          ssh -T -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "$cleanup"
