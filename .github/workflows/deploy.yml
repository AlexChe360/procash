name: Deploy ProCash

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: procash-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: procash_test
          POSTGRES_USER: procash_test
          POSTGRES_PASSWORD: procash_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U procash_test -d procash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/procash_test
      SPRING_DATASOURCE_USERNAME: procash_test
      SPRING_DATASOURCE_PASSWORD: procash_test_password
      PROCASH_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon


  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: test
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check SSH key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

      - name: Deploy ProCash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" 'bash -se' << 'EOF'

            set -euxo pipefail

            echo "=== SSH CONNECTED ==="
            whoami

            echo "=== OPEN PROJECT ==="
            cd /opt/procash
            pwd

            echo "=== GIT FETCH ==="
            GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=10' \
              git fetch origin main

            echo "=== UPDATE MAIN ==="
            git reset --hard origin/main

            echo "=== DOCKER BUILD ==="
            docker compose up -d --build --remove-orphans

            echo "=== CONTAINERS ==="
            docker compose ps

            echo "=== WAIT FOR PROCASH ==="

            for i in {1..45}; do
              if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
                echo "=== PROCASH DEPLOYED SUCCESSFULLY ==="
                exit 0
              fi

              echo "Waiting for ProCash... $i/45"
              sleep 2
            done

            echo "=== HEALTH CHECK FAILED ==="
            docker compose logs --tail=150 app
            exit 1

          EOF