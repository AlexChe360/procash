name: Deploy ProCash

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: procash-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: procash_test
          POSTGRES_USER: procash_test
          POSTGRES_PASSWORD: procash_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U procash_test -d procash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/procash_test
      SPRING_DATASOURCE_USERNAME: procash_test
      SPRING_DATASOURCE_PASSWORD: procash_test_password
      PROCASH_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon


  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy ProCash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' << 'EOF'

            set -euo pipefail

            cd /opt/procash

            echo "=== UPDATE CONFIG ==="

            GIT_SSH_COMMAND='ssh -i /home/deploy/.ssh/procash_deploy_git -o IdentitiesOnly=yes -o BatchMode=yes' \
              git fetch origin main

            git reset --hard origin/main

            echo "=== PULL IMAGE ==="
            docker compose pull app

            echo "=== START CONTAINERS ==="
            docker compose up -d --remove-orphans

            echo "=== STATUS ==="
            docker compose ps

            echo "=== HEALTH CHECK ==="

            for i in {1..45}; do
              if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
                echo "=== PROCASH DEPLOYED SUCCESSFULLY ==="
                exit 0
              fi

              echo "Waiting for ProCash... $i/45"
              sleep 2
            done

            echo "=== HEALTH CHECK FAILED ==="
            docker compose logs --tail=150 app
            exit 1

          EOF