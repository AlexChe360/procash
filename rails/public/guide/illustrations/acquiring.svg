<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Заявка мерчанта и рассмотрение эквайринга в ProCash</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="460" rx="18" fill="#f3f6ef" stroke="#f3f6ef"/><rect x="24" y="24" width="952" height="412" rx="12" fill="#fff" stroke="#e3e9dd"/><text x="48" y="65" font-size="25" fill="#263126" font-weight="700">Pro</text><text x="90" y="65" font-size="25" fill="#e66353" font-weight="700">Cash</text><text x="210" y="63" font-size="12" fill="#89967f" font-weight="500">КАБИНЕТ МЕРЧАНТА · ПРИМЕР</text><path d="M24 85H976" stroke="#e3e9dd"/><text x="48" y="126" font-size="22" fill="#263126" font-weight="600">Эквайринг / Подключение провайдера</text><rect x="48" y="158" width="280" height="180" rx="12" fill="#fff" stroke="#e3e9dd"/><circle cx="74" cy="188" r="14" fill="#eef7e9"/><text x="70" y="193" font-size="13" fill="#17ad55" font-weight="600">1</text><text x="68" y="234" font-size="20" fill="#263126" font-weight="600">Выбор провайдера</text><text x="68" y="270" font-size="14" fill="#89967f" font-weight="400">Отметьте нужные варианты</text><text x="68" y="295" font-size="14" fill="#89967f" font-weight="400">В кабинете мерчанта</text><rect x="360" y="158" width="280" height="180" rx="12" fill="#fff" stroke="#e3e9dd"/><circle cx="386" cy="188" r="14" fill="#eef7e9"/><text x="382" y="193" font-size="13" fill="#17ad55" font-weight="600">2</text><text x="380" y="234" font-size="20" fill="#263126" font-weight="600">Заявка в ProCash</text><text x="380" y="270" font-size="14" fill="#89967f" font-weight="400">Проверка и реквизиты</text><text x="380" y="295" font-size="14" fill="#89967f" font-weight="400">В админке ProCash</text><rect x="672" y="158" width="280" height="180" rx="12" fill="#fff" stroke="#e3e9dd"/><circle cx="698" cy="188" r="14" fill="#eef7e9"/><text x="694" y="193" font-size="13" fill="#17ad55" font-weight="600">3</text><text x="692" y="234" font-size="20" fill="#263126" font-weight="600">Решение</text><text x="692" y="270" font-size="14" fill="#89967f" font-weight="400">Статус виден мерчанту</text><text x="692" y="295" font-size="14" fill="#89967f" font-weight="400">Затем выбор основного</text><text x="48" y="400" font-size="15" fill="#89967f" font-weight="400">Merchant ID и секретные ключи настраивает только ProCash.</text></g></svg>