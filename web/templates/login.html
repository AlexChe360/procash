<section class="mx-auto max-w-md py-6 md:py-14"><p class="mb-3 text-sm font-semibold text-accent">Для партнёров ProCash</p><h1>Вход в кабинет</h1><p class="muted mt-4 mb-7">Доступ предоставляет команда ProCash после проверки заявки.</p>{{template "alerts" .}}<form class="card space-y-5" method="post" action="/login" hx-post="/login" hx-target="#workspace"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label class="field">Email<input class="input" type="email" name="email" value="{{index .Values "email"}}" autocomplete="username" maxlength="255" required></label><label class="field">Пароль<input class="input" type="password" name="password" autocomplete="current-password" required></label><button class="btn w-full" type="submit">Войти</button></form><p class="muted mt-6">Ещё не подключены? <a class="link text-ink" href="/connect">Отправить заявку</a></p><p class="muted mt-3">Забыли пароль? Напишите <a href="mailto:info@procash.kz" class="link">info@procash.kz</a>.</p></section>
