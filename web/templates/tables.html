<div class="page-heading"><div><p class="muted mb-2">{{.Restaurant.Name}}</p><h1>Столы и QR-коды</h1></div></div>{{template "restaurant-nav" .}}{{template "alerts" .}}<form class="card mb-6 flex flex-wrap items-end gap-4" method="post" action="/restaurants/{{.Restaurant.ID}}/tables" hx-post="/restaurants/{{.Restaurant.ID}}/tables" hx-target="#workspace"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label class="field">Номер стола<input class="input" name="table_number" maxlength="50" required></label><label class="field grow">Название<input class="input" name="display_name" maxlength="150"></label><button class="btn">Добавить стол</button></form><div class="table-wrap"><table class="w-full"><thead><tr><th>Стол</th><th>Название</th><th>QR-код</th></tr></thead><tbody>{{range .Tables}}<tr><td>{{.Number}}</td><td>{{.Name}}</td><td><a class="link" href="/restaurants/{{$.Restaurant.ID}}/tables/{{.ID}}">Открыть и скачать →</a></td></tr>{{else}}<tr><td colspan="3">Добавьте первый стол.</td></tr>{{end}}</tbody></table></div>
