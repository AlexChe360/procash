<section class="card mx-auto max-w-lg"><h1>Тестовая оплата</h1><p class="muted my-5">Деньги не списываются.</p>{{range .Payments}}<p class="mb-5 text-3xl font-bold">{{money .Amount}}</p><p class="mb-5">{{status .Status}}</p>{{if or (eq .Status "PENDING") (eq .Status "CREATED")}}<form method="post" action="/payments/{{.ID}}/mock/success"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button class="btn-accent w-full">Успешная тестовая оплата</button></form><form class="mt-3" method="post" action="/payments/{{.ID}}/mock/fail"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button class="btn-light w-full">Ошибка тестовой оплаты</button></form>{{end}}{{end}}</section>
