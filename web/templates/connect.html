<section class="mx-auto max-w-3xl"><p class="mb-3 text-sm font-semibold text-accent">Начнём сотрудничество</p><h1>Подключить ресторан</h1><p class="muted mt-4 mb-7">Расскажите о заведении. Мы свяжемся с вами, проверим заявку и предоставим доступ к личному кабинету.</p>{{template "alerts" .}}{{if not .Message}}<form class="card grid gap-5 sm:grid-cols-2" method="post" action="/connect" hx-post="/connect" hx-target="#workspace"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label class="field">Ваше имя *<input class="input" name="contact_name" autocomplete="name" value="{{index .Values "contact_name"}}" maxlength="255" required></label><label class="field">Email *<input class="input" name="email" type="email" autocomplete="email" value="{{index .Values "email"}}" maxlength="255" required></label><label class="field">Телефон *<input class="input" name="phone" type="tel" autocomplete="tel" value="{{index .Values "phone"}}" minlength="10" maxlength="30" required></label><label class="field">Название заведения *<input class="input" name="restaurant_name" value="{{index .Values "restaurant_name"}}" maxlength="150" required></label><label class="field">Город *<input class="input" name="city" value="{{index .Values "city"}}" maxlength="100" required></label><label class="field">Кассовая система<input class="input" name="pos_system" placeholder="iiko, r-Keeper, другая" value="{{index .Values "pos_system"}}" maxlength="100"></label><label class="field sm:col-span-2">Комментарий<textarea class="input min-h-28" name="comment" maxlength="3000">{{index .Values "comment"}}</textarea></label><div class="hidden" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><label class="flex items-start gap-3 text-sm text-neutral-600 sm:col-span-2"><input type="checkbox" name="consent" value="yes" class="mt-1" required>Согласен на обработку указанных данных для рассмотрения заявки и связи со мной.</label><button class="btn-accent sm:col-span-2" type="submit">Отправить заявку</button><p class="muted sm:col-span-2">Отправка заявки не создаёт аккаунт автоматически.</p></form>{{else}}<a href="/" class="btn">На главную</a>{{end}}</section>
