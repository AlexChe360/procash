<section class="max-w-xl"><h1>Изменить пароль</h1><p class="muted mt-4 mb-7">{{if .User.MustChange}}Вы вошли с временным паролем. Установите свой пароль, чтобы продолжить работу.{{else}}После изменения остальные сессии завершатся.{{end}}</p>{{template "alerts" .}}<form class="card space-y-5" action="/account/password" method="post" hx-post="/account/password" hx-target="#workspace"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label class="field">Текущий / временный пароль<input class="input" type="password" name="current_password" autocomplete="current-password" required></label><label class="field">Новый пароль<input class="input" type="password" name="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label class="field">Повторите новый пароль<input class="input" type="password" name="password_confirmation" autocomplete="new-password" minlength="12" maxlength="72" required></label><p class="muted">От 12 до 72 байт. Для кириллицы и эмодзи допустимое число символов меньше.</p><button class="btn w-full" type="submit">Установить пароль</button></form></section>
