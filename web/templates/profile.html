<div class="page-heading"><div><h1>Мои данные</h1><p class="muted mt-3">Контакты для работы с ProCash и заявок на подключение.</p></div><a class="btn-light" href="/account/password">Изменить пароль</a></div>{{template "alerts" .}}<form class="card max-w-2xl space-y-5" action="/account" method="post" hx-post="/account" hx-target="#workspace"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label class="field">Имя<input class="input" name="name" autocomplete="name" value="{{index .Values "name"}}" maxlength="255" required></label><label class="field">Телефон<input class="input" name="phone" type="tel" autocomplete="tel" value="{{index .Values "phone"}}" maxlength="30"></label><label class="field">Email для входа<input class="input" name="email" type="email" autocomplete="username" value="{{index .Values "email"}}" maxlength="255" required></label><label class="field">Текущий пароль (для смены email)<input class="input" name="current_password" type="password" autocomplete="current-password"></label><p class="muted">После смены email все текущие сессии завершатся. Войдите с новым адресом.</p><button class="btn" type="submit">Сохранить данные</button></form>
