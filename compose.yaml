services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procash}
      POSTGRES_USER: ${POSTGRES_USER:-procash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - procash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: ${PROCASH_IMAGE:-procash:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Generate and set APP_KEY}
      APP_URL: ${APP_URL:-https://procash.kz}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-procash}
      DB_USERNAME: ${POSTGRES_USER:-procash_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-info@procash.kz}
      SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-}}
      SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USERNAME: ${SMTP_USERNAME:-${MAIL_USERNAME:-}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_FROM_ADDRESS:-info@procash.kz}}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      PROCASH_MOCK_PAYMENTS: ${PROCASH_MOCK_PAYMENTS:-false}
      PROCASH_MOCK_ORDERS: ${PROCASH_MOCK_ORDERS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "procash", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  procash_postgres_data:
